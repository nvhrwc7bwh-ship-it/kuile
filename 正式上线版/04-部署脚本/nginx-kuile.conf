# ============================================================================
# 亏了 · 正式上线版 · Nginx 配置
# ----------------------------------------------------------------------------
# 【小白须知】Nginx 是「门口的接待员」——
#   负责接收所有外部请求，按规则转发给我们的后端服务。
#
# 【怎么用】
#   1. 把本文件复制到服务器的 /etc/nginx/conf.d/kuile.conf
#      命令：sudo cp kuile.conf /etc/nginx/conf.d/
#   2. 改里面的域名（把 yourdomain.com 换成你的真实域名）
#   3. 检查配置：sudo nginx -t
#   4. 重启：sudo nginx -s reload
#
# 【这个配置做了三件事】
#   ① HTTPS 加密（微信小程序正式版强制要求）
#   ② 反向代理：把 /api/ 开头的请求转给后端
#   ③ 静态资源加速：图片直接从 COS 走
# ============================================================================

# ---------------------------------------------------------------------------
# HTTP → HTTPS 强制跳转
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.yourdomain.com;

    # 微信支付回调需要校验来源，保留这个地址便于排查
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS 主服务
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.yourdomain.com;

    # ---- SSL 证书路径 ----
    # 证书从腾讯云 SSL 证书服务下载后放到这里
    ssl_certificate     /etc/nginx/ssl/kuile/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kuile/privkey.pem;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- 上传大小限制（打卡照片最大 5MB，留余量）----
    client_max_body_size 10m;

    # ---- 访问日志 ----
    access_log /var/log/nginx/kuile.access.log;
    error_log  /var/log/nginx/kuile.error.log;

    # ---- 限流：防止刷接口 ----
    # 每个 IP 每分钟最多 120 次请求
    limit_req_zone $binary_remote_addr zone=kuile_api:10m rate=120r/m;

    location /api/ {
        limit_req zone=kuile_api burst=20 nodelay;

        # 转发给后端（127.0.0.1:3000 是本机的 Node 服务）
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 微信支付回调可能慢，给足超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- 健康检查：不需要 token，方便监控 ----
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # ---- 默认：也是转发给后端 ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
